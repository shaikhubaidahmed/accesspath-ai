services:
  - type: web
    name: accesspath
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_MODE
        value: live
      - key: OLLAMA_BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
